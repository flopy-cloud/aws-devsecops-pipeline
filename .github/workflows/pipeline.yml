name: pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devsecops-app

jobs:
  checkov:
    name: Análisis de configuración (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,dockerfile
          quiet: true

  build-scan-push:
    name: Build, escaneo (Trivy) y subida a ECR
    needs: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t app:${{ github.sha }} ./app

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Depuración OIDC
        if: github.ref == 'refs/heads/main'
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "Largo del secreto (debería ser 54): ${#ROLE}"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{iss, sub, aud}'

      - name: Credenciales de AWS (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Subir imagen a ECR
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker tag app:${{ github.sha }} $IMAGE
          docker push $IMAGE